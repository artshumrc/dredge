[project]
name = "dredge"
version = "0.3.0"
description = "Static-site SQLite search compiler"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "selectolax>=0.4.3",
    "brotli>=1.1.0",
    "rich>=13.7.0",
]

[project.scripts]
dredge = "dredge.cli:main"

# scripts/ holds repo tooling that tests import but the wheel must not ship.
[tool.pytest.ini_options]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dredge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
